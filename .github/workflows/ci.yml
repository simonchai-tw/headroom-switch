name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test

  verify-ps1:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run verify-fix.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\verify-fix.ps1
      - name: Show verify-output.txt
        if: always()
        shell: powershell
        run: Get-Content -LiteralPath .\verify-output.txt
